<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS_02_ Css Selectors</title>
    <!-- <link rel="stylesheet" href="css2.css" /> -->
  </head>
  <!--  internal CSS  -->
  <style>
    /* universal selector */
    /* what is a universal selector?
   Selects all elements on the page.*/
    * {
      color: red;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      background-color: brightywhite;
    }

    /* type selector */
    /* Selects all elements of a specific HTML tag. */
    h2 {
      color: blue;
      font-size: 30px;
      border: 2px solid black;
      padding: 10px;
      background-color: lightgray;
    }
    p {
      color: green;
      font-size: 25px;
    }
    label {
      color: Black;
      font-family: arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: bold;
    }

    /* class selector */
    /* Selects all elements having a specific class attribute. */
    .pragraph {
      color: purple;
      font-size: 28px;
      font-weight: bold;
    }

    /* Id selector */
    /* Selects the element with a specific id attribute. */
    #username {
      color: Black;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      padding: 5px;
      border: 2px solid black;
      background-color: yellow;
      font-family: arial, Helvetica, sans-serif;
    }
    #username {
      color: black;
    }

    /* child selector */
    /* Selects direct child elements of a specific parent element. */
    ul > li {
      color: orange;
      font-size: 24px;
      font-weight: bold;
    }
    ul > li > a {
      color: yellow;
      font-size: 22px;
      font-weight: bold;
    }

    /* descendant selector */
    /* Selects all elements that are descendants of a specific parent element. */
    div h2 {
      color: green;
      font-size: 26px;
      font-weight: bold;
      background-color: lightblack;
    }

    /* adjacent sibling selector */
    /* Selects elements that are immediately preceded by another element. */
    h2 + p {
      color: orange;
      font-weight: bold;
    }
    form + p {
      color: darkblue;
      font-size: 30px;
    }

    /* General sibling selector */
    /* Selects all elements that are preceded by another element. */
    h2 ~ p {
      color: red;
      font-weight: bold;
    }
  </style>
  <!-- main body -->
  <body>
    <div>
      <p>Lorem ipsum dolor sit amet.</p>
      <div>
        <h2>This is a Heading</h2>
        <p>Khattak King.</p>
      </div>
    </div>

    <form action="">
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" /> <br />
      <br />
      <input type="submit" value="Submit" />
    </form>

    <p class="pragraph">This is a paragraph. My name is Muhammad Habab</p>

    <ul>
      <li><a href="">Item 1</a></li>
      <li><a href="">Item 2</a></li>
      <li><a href="">Item 3</a></li>
    </ul>
  </body>
</html>
