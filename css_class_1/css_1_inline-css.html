<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="External-Style_01.css" />
  </head>

  <!-- Internal CSS -->
  <style>
    <!-- /*Internal CSS */
    /* internal CSS is used to define CSS styles within the HTML document */ -->
    /* h2: selector */
    /* {}: declaration */
    /* Property Name: property-value; property */
    h2 {
      color: blue;font-size: 30px;font-weight: bold;background-color: lightgreen;
      border: 2px solid rgb(32, 24, 142);
    }
  </style>

  <body>
    <!-- Inline CSS -->
    <!-- inline CSS is used to define CSS styles directly within an HTML element -->
    <p
      style="
        color: red;
        font-size: 50px;
        font-weight: bold;
        background-color: yellow;
        border: 1px solid blue;
      "
    >
      We trying to Learn CSS in SMIT Web Development Course. This is an example
      of inline CSS.
    </p>
    <h2>I try to learn Internal CSS. This is an example of Internal CSS.</h2>
    <div>
      This is a div element. I try to learn External CSS. This is an example of
      External CSS.
    </div>
  </body>
</html>
